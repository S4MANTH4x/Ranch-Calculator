<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Ranch Manager System ✨</title>
    <style>
        /* ==========================================
           🎨 UI COLOR CUSTOMIZATION (From Python)
           ========================================== */
        :root {
            --app-bg: #121212;
            --sidebar-bg: #181818;
            --panel-bg: #1E1E1E;
            --panel-border: #333333;
            --entry-bg: #2A2A2A;
            --entry-border: #374151;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --nav-text-idle: #9CA3AF;
            --nav-text-active: #4ADE80;
            --nav-bg-active: #163323;
            --nav-hover: #262626;
            --item-btn-bg: #252526;
            --item-btn-hover: #3E3E42;
            --item-btn-border: #333333;
            --primary-btn: #2FA572;
            --primary-btn-hover: #1E7A52;
            --secondary-btn: #374151;
            --secondary-btn-hover: #4B5563;
            --danger-btn: #991B1B;
            --danger-btn-hover: #7F1D1D;
            --receipt-bg: #141414;
            --receipt-border: #333333;
        }

        body {
            margin: 0;
            height: 100vh;
            background-color: var(--app-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            overflow: hidden;
        }

        /* ---------------- SIDEBAR ---------------- */
        #sidebar {
            width: 230px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            padding-top: 30px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            padding: 0 20px 25px 20px;
        }

        .nav-btn {
            background: transparent;
            color: var(--nav-text-idle);
            border: none;
            text-align: left;
            padding: 15px 20px;
            margin: 4px 12px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background-color: var(--nav-hover);
        }

        .nav-btn.active {
            background-color: var(--nav-bg-active);
            color: var(--nav-text-active);
        }

        /* ---------------- MAIN CONTENT AREA ---------------- */
        #main-container {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .view-section {
            display: none;
            height: 100%;
            gap: 20px;
        }

        .view-section.active {
            display: flex;
        }

        .panel-left {
            flex: 3;
            background-color: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .panel-right {
            flex: 2;
            background-color: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        h2 { margin: 0 0 15px 0; font-size: 18px; }

        /* Inputs & Buttons */
        input {
            background-color: var(--entry-bg);
            border: 1px solid var(--entry-border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 6px;
            outline: none;
            font-family: inherit;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button.action-btn {
            flex: 1;
            background-color: var(--primary-btn);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover { background-color: var(--primary-btn-hover); }

        button.action-btn.secondary-btn {
            background-color: var(--secondary-btn);
        }

        button.action-btn.secondary-btn:hover {
            background-color: var(--secondary-btn-hover);
        }

        button.action-btn.danger-btn {
            background-color: var(--danger-btn);
        }

        button.action-btn.danger-btn:hover {
            background-color: var(--danger-btn-hover);
        }

        /* Catalog Grids */
        .catalog-scroll {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            padding-right: 5px;
        }

        /* Custom Scrollbar for Dark Mode */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        .item-card {
            background-color: var(--item-btn-bg);
            border: 1px solid var(--item-btn-border);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85px;
        }

        .item-card:hover { background-color: var(--item-btn-hover); }
        .item-card.selected { border-color: var(--primary-btn); }

        .item-icon {
            width: 36px; height: 36px;
            background-color: #2D3748;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin-bottom: 8px;
        }

        .item-name { font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .item-price { font-size: 11px; color: var(--text-muted); }

        /* Output Text Areas */
        .receipt-box {
            flex-grow: 1;
            background-color: var(--receipt-bg);
            border: 1px solid var(--receipt-border);
            border-radius: 6px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .seed-results {
            background-color: var(--receipt-bg);
            border: 1px solid var(--receipt-border);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-top: auto;
        }
        .res-label { color: var(--text-muted); font-size: 13px; margin-bottom: 5px;}
        .res-val { color: var(--primary-btn); font-size: 18px; font-weight: bold;}
    </style>
</head>
<body>

    <nav id="sidebar">
        <div class="logo">Ranch Manager</div>
        <button class="nav-btn active" onclick="switchView('shopping')" id="btn-shopping">🛒 Shopping List</button>
        <button class="nav-btn" onclick="switchView('crafting')" id="btn-crafting">🛠️ Crafting Calculator</button>
        <button class="nav-btn" onclick="switchView('seeds')" id="btn-seeds">🌾 Seed Calculator</button>
    </nav>

    <!-- ---------------- MAIN CONTENT ---------------- -->
    <div id="main-container">

        <!-- VIEW 1: SHOPPING -->
        <section id="view-shopping" class="view-section active">
            <div class="panel-left">
                <h2>Produce Catalog</h2>
                <input type="text" id="shop-search" placeholder="Search produce... 🔍" oninput="renderShopCatalog()">
                <div class="catalog-scroll" id="shop-catalog"></div>
            </div>
            <div class="panel-right">
                <h2 id="lbl-shop-sel">Select an Item</h2>
                <input type="number" id="shop-qty" placeholder="Quantity" value="1" min="1">
